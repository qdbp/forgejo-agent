version = 1
allowed_actors = ["main"]
forgejoctl_bin = "/home/main/.local/bin/forgejoctl"

[roles.codex-orch]
codex_bin = "/home/main/forgejo-agent/bin/codex-role"
codex_role_arg = "orch"
token_file = "/home/main/.config/forgejo-agent/creds/codex-orch.token"

[control_plane]
token_file = "/home/main/.config/forgejo-agent/creds/orchd.token"

[[repo_bindings]]
repo = "main/forgejo-agent"
local_path = "/home/main/forgejo-agent"
git_remote = "origin"
git_base = "main"

[prompt_envelopes]
preamble_file = "../prompts/orchd-preamble.md"
fresh_envelope = "../prompts/orchd-envelope-fresh.md"
followup_envelope = "../prompts/orchd-envelope-followup.md"
turn_context_file = "../prompts/orchd-turn-context.md"
issue_fresh_file = "../prompts/orchd-issue-fresh.md"
issue_followup_file = "../prompts/orchd-issue-followup.md"

[notifications]
enabled = true
poll_sec = 10
phases = ["completed", "failed", "blocked"]
app_name = "orchd"
watch_login = "main"
notify_send_bin = "/usr/bin/notify-send"

[directives.design]
role = "codex-orch"
prompt_file = "../prompts/orchd-design.md"
timeout_sec = 1800

[directives.impl]
role = "codex-orch"
prompt_file = "../prompts/orchd-impl.md"
timeout_sec = 7200

[directives.reply]
role = "codex-orch"
prompt_file = "../prompts/orchd-poke.md"
timeout_sec = 1200

[directives.poke]
role = "codex-orch"
prompt_file = "../prompts/orchd-poke.md"
timeout_sec = 1200
