version = 1
allowed_actors = ["main"]
forgejoctl_bin = "/home/main/.local/bin/forgejoctl"

[roles.codex-orch]
codex_bin = "/home/main/forgejo-agent/bin/codex-role"
codex_role_arg = "orch"
token_file = "/home/main/.config/forgejo-agent/creds/codex-orch.token"

[roles.codex-lead]
codex_bin = "/home/main/forgejo-agent/bin/codex-role"
codex_role_arg = "lead"
token_file = "/home/main/.config/forgejo-agent/creds/codex-lead.token"

[roles.codex-dev]
codex_bin = "/home/main/forgejo-agent/bin/codex-role"
codex_role_arg = "dev"
token_file = "/home/main/.config/forgejo-agent/creds/codex-dev.token"

[roles.codex-audit]
codex_bin = "/home/main/forgejo-agent/bin/codex-role"
codex_role_arg = "auditor"
forgejo_login = "codex-audit"
token_file = "/home/main/.config/forgejo-agent/creds/codex-audit.token"

[control_plane]
token_file = "/home/main/.config/forgejo-agent/creds/orchd.token"

[rank_acl]
enabled = true

[rank_acl.ranks."OF-10"]
own_directives = ["design", "investigate", "impl", "reply"]
delegation_directives = ["design", "investigate", "impl", "reply"]

[rank_acl.ranks."OF-8"]
own_directives = ["design", "investigate", "impl", "reply"]
delegation_directives = ["design", "investigate", "impl", "reply"]

[rank_acl.ranks."OF-4"]
own_directives = ["design", "investigate", "impl", "reply"]
delegation_directives = ["design", "investigate", "impl", "reply"]

[rank_acl.ranks."OF-2"]
own_directives = ["impl", "reply"]
delegation_directives = ["impl", "reply"]

[[repo_bindings]]
repo = "main/forgejo-agent"
local_path = "/home/main/forgejo-agent"
git_remote = "origin"
git_base = "main"

[prompt_envelopes]
preamble_file = "../prompts/orchd-preamble.md"
fresh_envelope = "../prompts/orchd-envelope-fresh.md"
followup_envelope = "../prompts/orchd-envelope-followup.md"
turn_context_file = "../prompts/orchd-turn-context.md"
issue_fresh_file = "../prompts/orchd-issue-fresh.md"
issue_followup_file = "../prompts/orchd-issue-followup.md"

[notifications]
enabled = true
poll_sec = 10
phases = ["completed", "failed", "blocked"]
app_name = "orchd"
watch_login = "main"
notify_send_bin = "/usr/bin/notify-send"

[directives.design]
role = "codex-orch"
prompt_file = "../prompts/orders/orchd-design.md"
timeout_sec = 1800

[directives.investigate]
role = "codex-orch"
prompt_file = "../prompts/orders/orchd-investigate.md"
timeout_sec = 2400

[directives.impl]
role = "codex-orch"
prompt_file = "../prompts/orders/orchd-impl.md"
timeout_sec = 7200

[directives.reply]
role = "codex-orch"
prompt_file = "../prompts/orders/orchd-reply.md"
timeout_sec = 1200

[trigger_guardrails]
max_depth_per_issue = 6
max_dispatches_per_window = 12
window_sec = 3600
cooldown_sec = 60
deny_immediate_self_loop = true

[[triggers]]
id = "closed_issue_poke"
event = "issues"
actions = ["closed"]
priority = 0
apply_guardrails = true

[triggers.action]
directive = "reply"
target_role = "codex-orch"
